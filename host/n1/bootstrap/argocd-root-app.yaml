apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-application
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # HIER: Der Pfad zu deinem Git-Repository
    repoURL: 'https://github.com/DEIN_USER/DEIN_CLUSTER_REPO.git'
    targetRevision: HEAD
    # HIER: Der Ordner im Repo, in dem die restlichen Cluster-Manifeste liegen
    path: apps 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true